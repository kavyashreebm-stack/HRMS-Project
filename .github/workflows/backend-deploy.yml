name: Deploy Backend to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main
    paths:
      - 'HR-Backend/**'
      - 'pack_backend.py'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Create Backend Zip Bundle
        run: python pack_backend.py

      - name: Deploy to AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: "HR-Backend-Project"  # Adjust this if your Beanstalk App name is different
          environment_name: "HR-Backend-Project-env"  # Adjust this if your Beanstalk Environment name is different
          version_label: "backend-${{ github.sha }}"
          region: "ap-southeast-2"  # Region inferred from your Beanstalk URL
          deployment_package: "backend_deploy.zip"
